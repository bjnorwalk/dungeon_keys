name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test persistence and word selection without a window
        run: |
          cc -std=c11 -Wall -Wextra -Werror tests/core_test.c src/save_data.c src/word_bank.c -lm -o "$RUNNER_TEMP/dungeon-core-tests"
          mkdir -p "$RUNNER_TEMP/dungeon-core-data"
          cd "$RUNNER_TEMP/dungeon-core-data"
          "$RUNNER_TEMP/dungeon-core-tests"
      - name: Install raylib build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 2
